name: CI

on:
  push:
    branches: [ master, main, fix/cleanup-node-modules ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: delivery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d delivery_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/backend/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run go vet
        working-directory: backend
        run: |
          go vet ./...

      - name: Run golangci-lint
        working-directory: backend
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(pwd)/bin v1.59.0
          PATH=$(pwd)/bin:$PATH
          ./bin/golangci-lint --version
          ./bin/golangci-lint run ./...

      - name: Run backend tests
        working-directory: backend
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: delivery_db
        run: |
          go test ./... -v -count=1

      - name: Build backend
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 go build -o dms ./cmd

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U admin -d delivery_db && break || sleep 1
          done

      - name: Run backend (background)
        working-directory: backend
        run: |
          ./dms &
          sleep 2

      - name: Smoke test /healthz
        run: |
          curl -fsS http://localhost:8080/healthz

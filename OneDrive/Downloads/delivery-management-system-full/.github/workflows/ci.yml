name: CI

on:
  push:
    branches: [ master, main, fix/cleanup-node-modules ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: delivery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d delivery_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build backend
        working-directory: backend
        run: |
          go mod download
          CGO_ENABLED=0 go build -o dms ./cmd

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U admin -d delivery_db && break || sleep 1
          done

      - name: Run backend (background)
        working-directory: backend
        run: |
          ./dms &
          sleep 2

      - name: Smoke test /healthz
        run: |
          curl -fsS http://localhost:8080/healthz

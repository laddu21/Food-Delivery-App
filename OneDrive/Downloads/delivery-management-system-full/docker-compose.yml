version: "3.8"
services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=delivery_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecretjwt
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: delivery_db
    volumes:
      - ./backend/sql:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      # pg_isready defaults DB name to the user if -d is not provided; the project
      # creates `delivery_db` so explicitly check that database to avoid spurious
      # "database \"admin\" does not exist" errors in Postgres logs.
      test: ["CMD-SHELL","pg_isready -U admin -d delivery_db || exit 1"]
      interval: 5s
      retries: 5
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

